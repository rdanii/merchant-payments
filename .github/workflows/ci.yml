name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Disposable CI database; the integration tests truncate every table.
      TEST_DATABASE_URL: postgres://payments:ci-only-password@localhost:5432/payments_test?sslmode=disable
      # Fail, instead of skip, if the PostgreSQL tests cannot run.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test (race, including PostgreSQL integration tests)
        # ubuntu-latest ships gcc, which the race detector requires.
        run: CGO_ENABLED=1 go test -race -count=1 ./...
