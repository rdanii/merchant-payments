# LOCAL DEVELOPMENT ONLY. Not a production deployment: it runs with
# APP_ENV=development, may enable the devsim provider simulator, publishes
# ports on localhost only, and the merchant API has no authentication.
# Values come from .env (copy .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      # Credentials are passed as libpq environment variables (read by pgx)
      # instead of being interpolated into a URL, so passwords containing
      # characters such as @ : / ? # % work without escaping.
      DATABASE_URL: "host=postgres port=5432 sslmode=disable"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      AUTO_MIGRATE: "true"
      LOG_LEVEL: INFO
      PROVIDER_TIMEOUT: 15s
      # The server refuses DEVSIM_ENABLED=true when APP_ENV=production.
      DEVSIM_ENABLED: ${DEVSIM_ENABLED:-false}
      DEVSIM_WEBHOOK_SECRET: ${DEVSIM_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # The distroless image has no shell or curl; the binary checks /healthz.
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
